[package]
name = "resolve-merge-conflicts"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Resolve git merge conflicts with a CLI agent (Claude Code or Codex), then review the result yourself."
authors = ["Christopher Vachon <code@christophervachon.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/CodeVachon/resolve-merge-conflict"
homepage = "https://github.com/CodeVachon/resolve-merge-conflict#readme"
keywords = ["git", "merge", "conflicts", "cli", "agent"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "resolve_merge_conflicts"
path = "src/lib.rs"

[[bin]]
name = "resolve-merge-conflicts"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4"
dirs = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
